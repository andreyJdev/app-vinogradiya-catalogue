spring:
  application:
    name: app-vinogradiya-catalogue
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    drop-first: true
    default-schema: public
    change-log: classpath:db/changelog/changelog-test.yml
    database-change-log-table: DEVOPS_DATABASE_CHANGE_LOG
    database-change-log-lock-table: DEVOPS_DATABASE_CHANGE_LOG_LOCK
zonky:
  test:
    database:
      postgres:
        client:
          properties:
            currentSchema: main